<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFS - The Pearl of Africa | Kampala Food Shop</title>
<link rel="icon" href="IMG-20261011-WA9432.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f8f5ee}
.header-flag{width:100%;height:8px;display:flex}
.flag-black{flex:1;background:#000}
.flag-yellow{flex:1;background:#FCDC04}
.flag-red{flex:1;background:#D90000}
.main-header{background:#111;display:flex;align-items:center;padding:10px 15px;gap:12px}
.logo{width:65px;height:65px;border-radius:12px;background:white;padding:4px;object-fit:contain;border:3px solid #FCDC04}
.header-text h1{color:#FCDC04;font-size:20px;line-height:1.1}
.header-text p{color:white;font-size:12px;letter-spacing:1px}
.header-text span{color:#FCDC04;font-weight:bold}
.cart-badge{background:#FCDC04;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold;margin-left:auto}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);border:1px solid #eee}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:15px;margin-bottom:4px}
.price{color:#D90000;font-weight:bold;font-size:13px}
.type-kg{display:flex;gap:6px;margin:8px 0;align-items:center}
.type-kg input{width:100%;padding:8px;border:2px solid #FCDC04;border-radius:8px;font-weight:bold;text-align:center}
.type-kg label{font-size:11px;font-weight:bold;white-space:nowrap}
.add-btn{width:100%;background:#000;color:#FCDC04;border:none;padding:9px;border-radius:8px;font-weight:bold}
.admin{padding:12px;background:#111;margin:12px;border-radius:12px}
.admin h3{color:#FCDC04;margin-bottom:8px}
.admin input{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #555}
.admin button{background:#FCDC04;color:#000;border:none;padding:8px 12px;border-radius:6px;font-weight:bold;margin-top:6px;width:100%}
.cart-section{position:fixed;bottom:0;left:0;right:0;background:white;border-top:3px solid #FCDC04;padding:12px;max-height:60vh;overflow:auto;display:none}
.cart-section.show{display:block}
.cart-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
.pay-btn{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:none;font-weight:bold}
.momo{background:#FCDC04;color:#000}
.cardpay{background:#000;color:white}
.cod{background:white;color:#000;border:2px solid #000!important}
.cod small{display:block;font-size:10px;font-weight:normal}
</style>
</head>
<body>
<div class="header-flag"><div class="flag-black"></div><div class="flag-yellow"></div><div class="flag-red"></div></div>
<div class="main-header">
<img src="IMG-20261011-WA9432.jpg" class="logo">
<div class="header-text">
<h1>KFS</h1>
<p>The Pearl of <span>Africa</span></p>
<p style="font-size:10px;opacity:0.8">Kampala Food Shop</p>
</div>
<div class="cart-badge" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>
</div>
<div class="header-flag"><div class="flag-black"></div><div class="flag-yellow"></div><div class="flag-red"></div></div>

<div id="products" class="products"></div>

<div class="admin">
<h3>👑 Boss Wilson - Add Product</h3>
<input id="pName" placeholder="Product name e.g. Super Rice">
<input id="pPrice" type="number" placeholder="Price per KG e.g. 5000">
<input id="pImg" placeholder="Image URL (optional)">
<button onclick="addProduct()">Add Product +</button>
<button onclick="resetShop()" style="background:#D90000;color:white;margin-top:8px">Reset Default</button>
</div>

<div id="cart" class="cart-section">
<h3>Your Order 🛒</h3>
<div id="cartItems"></div>
<div style="font-weight:bold;margin-top:8px">Total: UGX <span id="total">0</span></div>
<button class="pay-btn momo">📱 Pay Mobile Money</button>
<button class="pay-btn cardpay">💳 Pay Card</button>
<button class="pay-btn cod">🚚 Cash on Delivery <small>Pay when we deliver - last option</small></button>
<button onclick="toggleCart()" style="width:100%;margin-top:8px;padding:8px;background:#eee;border:none;border-radius:8px">Close</button>
</div>

<script>
let defaultProducts=[
{name:"Super Rice",price:5000,img:"https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=400"},
{name:"Beans",price:4000,img:"https://images.unsplash.com/photo-1586201375761-3864a2d2d9cd?w=400"},
{name:"Posho Maize",price:3000,img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=400"},
{name:"G-Nuts",price:6000,img:"https://images.unsplash.com/photo-1508061253366-f7da158b6d46?w=400"}
];
let products=JSON.parse(localStorage.getItem('kfs_products')||'null')||defaultProducts;
let cart=[];
function render(){
let html='';
products.forEach((p,i)=>{
html+=`<div class="card">
<img src="${p.img||'IMG-20261011-WA9432.jpg'}" onerror="this.src='IMG-20261011-WA9432.jpg'">
<div class="card-body">
<h3>${p.name}</h3>
<div class="price">UGX ${p.price.toLocaleString()} / KG</div>
<div class="type-kg"><label>TYPE KG:</label><input type="number" id="kg-${i}" placeholder="e.g. 2.5" min="0.1" step="0.1" value="1"></div>
<button class="add-btn" onclick="addToCart(${i})">Add to Cart</button>
<button onclick="deleteProduct(${i})" style="background:none;border:none;color:#999;font-size:10px;margin-top:4px;width:100%">Delete</button>
</div></div>`;
});
document.getElementById('products').innerHTML=html;
}
function addToCart(i){
let kg=parseFloat(document.getElementById(`kg-${i}`).value)||0;
if(kg<=0){alert('Type KG Boss! e.g. 2');return;}
let item=products[i];
let existing=cart.find(c=>c.name===item.name);
if(existing){existing.kg+=kg}else{cart.push({name:item.name,price:item.price,kg:kg});}
updateCart();toggleCart(true);
}
function updateCart(){
let total=0,html='';
cart.forEach((c,idx)=>{
total+=c.price*c.kg;
html+=`<div class="cart-item"><span>${c.name} - ${c.kg}KG</span><span>UGX ${(c.price*c.kg).toLocaleString()} <button onclick="removeItem(${idx})" style="color:red;border:none;background:none">x</button></span></div>`;
});
document.getElementById('cartCount').innerText=cart.length;
document.getElementById('total').innerText=total.toLocaleString();
document.getElementById('cartItems').innerHTML=html||'<p style="color:#999">Cart empty</p>';
}
function removeItem(i){cart.splice(i,1);updateCart();}
function toggleCart(show){let el=document.getElementById('cart');if(show===true){el.classList.add('show')}else{el.classList.toggle('show')}}
function addProduct(){
let name=document.getElementById('pName').value.trim();
let price=parseInt(document.getElementById('pPrice').value);
let img=document.getElementById('pImg').value.trim();
if(!name||!price){alert('Enter name and price');return;}
products.push({name,price,img:img||''});
localStorage.setItem('kfs_products',JSON.stringify(products));
render();alert('Added Boss!');
}
function deleteProduct(i){if(confirm('Delete '+products[i].name+'?')){products.splice(i,1);localStorage.setItem('kfs_products',JSON.stringify(products));render();}}
function resetShop(){localStorage.removeItem('kfs_products');products=[...defaultProducts];render();}
render();
</script>
</body>
</html>
