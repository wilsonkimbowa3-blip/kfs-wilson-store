<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href='data:application/json;base64,eyJuYW1lIjoiS0ZTIEthbXBsYSBGb29kIFNob3AiLCJzaG9ydF9uYW1lIjoiS0ZTIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzEwMmE1NCIsInRoZW1lX2NvbG9yIjoiIzEwMmE1NCIsImljb25zIjpbXX0='>
<meta name="theme-color" content="#102a54">
<title>KFS - The Pearl of Africa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
body{background:#0a1a33;color:#fff;padding-bottom:90px}
.header{background:#102a54;padding:10px;border-bottom:3px solid #FCDC04;position:sticky;top:0;z-index:100}
.logo-row{display:flex;align-items:center;justify-content:space-between}
.logo{width:60px;height:60px;border-radius:12px;border:2px solid #FCDC04;object-fit:cover}
.cart-badge{background:#FCDC04;color:#000;padding:8px 14px;border-radius:20px;font-weight:900}
.btn{padding:8px 12px;border-radius:20px;border:0;font-weight:900;cursor:pointer;margin:3px;font-size:12px}
.btn-shop{background:#FCDC04;color:#000}.btn-admin{background:#102a54;color:#00FF88;border:1px solid #00FF88}.btn-reset{background:#102a54;color:#ff4444;border:1px solid #ff4444}.btn-gal{background:#102a54;color:#FCDC04;border:1px solid #FCDC04}.btn-dl{background:#00FF88;color:#000}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;color:#000;border-radius:12px;overflow:hidden;border:2px solid #FCDC04}
.card img{width:100%;height:110px;object-fit:cover}
.card-body{padding:6px}
.price{color:#cc0000;font-weight:900;font-size:13px}
.inp{width:100%;padding:8px;border:2px solid #FCDC04;border-radius:8px;text-align:center;font-weight:900;margin:4px 0}
.add{width:100%;padding:10px;background:#000;color:#FCDC04;border:0;border-radius:8px;font-weight:900;cursor:pointer}
.out{background:#ff4444!important;color:#fff!important}
.checkout-bar{position:fixed;bottom:0;left:0;right:0;background:#FCDC04;color:#000;padding:8px;display:flex;justify-content:space-between;align-items:center;z-index:200;font-weight:900;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:none;overflow:auto;padding:15px}
.modal-box{background:#102a54;border:2px solid #FCDC04;border-radius:12px;padding:15px;max-width:500px;margin:auto;color:#fff}
.tab{padding:8px 12px;cursor:pointer;border-radius:8px;margin:2px;display:inline-block;font-size:12px}
.tab.active{background:#FCDC04;color:#000}
</style></head><body>
<div class="header">
<div class="logo-row">
<div style="display:flex;align-items:center;gap:8px"><img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc?w=100" class="logo"><div><div style="color:#FCDC04;font-weight:900;font-size:18px">KFS</div><div style="color:#00FF88;font-size:11px">The Pearl of Africa</div><div style="font-size:9px">Kampala Food Shop • GPS + BANK + AI</div></div></div>
<div class="cart-badge" onclick="openCart()">🛒 <span id="cartCount">0</span></div>
</div>
<div style="margin-top:8px">
<button class="btn btn-shop" onclick="renderShop()">🛒 SHOP</button>
<button class="btn btn-admin" onclick="requestAdmin()">⚙️ ADMIN</button>
<button class="btn btn-reset" onclick="resetCart()">🔒 RESET CART</button>
<button class="btn btn-gal" onclick="openGalleryCust()">🖼️ GALLERY</button>
<button class="btn btn-dl" onclick="downloadApp()">📲 DOWNLOAD APP</button>
</div></div>
<div id="shop" class="shop"></div><div class="checkout-bar"><div><span id="cartInfo">0 types • 0kg • UGX 0</span><br><span style="font-size:9px">0700892386 • BANK • COD • GPS • AI ON</span></div><button class="btn btn-shop" onclick="openCheckout()">CHECKOUT 🧾</button></div>

<div id="checkoutModal" class="modal"><div class="modal-box"><h3>🧾 Checkout</h3>
<input id="custName" class="inp" placeholder="Your Name">
<input id="custPhone" class="inp" placeholder="Phone 07...">
<input id="custLoc" class="inp" placeholder="Location + GPS">
<select id="payMode" class="inp"><option value="COD">Cash on Delivery</option><option value="BANK">Bank Transfer</option><option value="MoMo">MTN MoMo</option></select>
<div id="checkoutList" style="margin:10px 0;font-size:12px;color:#fff"></div>
<div style="display:flex;gap:6px"><button class="btn btn-shop" style="flex:1" onclick="sendWA()">SEND WhatsApp</button><button class="btn btn-reset" style="flex:1" onclick="closeModal('checkoutModal')">CLOSE</button></div>
</div></div>

<div id="galleryModal" class="modal"><div class="modal-box"><h3>🖼️ KFS Gallery</h3><div id="galleryCust" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0"></div><button class="btn btn-reset" style="width:100%" onclick="closeModal('galleryModal')">CLOSE</button></div></div>

<div id="adminModal" class="modal"><div class="modal-box" style="max-width:650px">
<h3>⚙️ ADMIN - wilson321</h3>
<div style="margin:8px 0"><span class="tab active" onclick="showPane('prod')">📦 PRODUCTS</span><span class="tab" onclick="showPane('orders')">📋 ORDERS</span><span class="tab" onclick="showPane('gal')">🖼️ GALLERY</span><span class="tab" onclick="showPane('set')">⚙️ SETTINGS</span><span class="tab" onclick="showPane('ai')">☁️ AI+CLOUD</span></div>

<div id="paneProd"><div style="display:grid;gap:6px">
<input id="pName" class="inp" placeholder="Product Name e.g. Super Rice">
<input id="pPrice" class="inp" type="number" placeholder="Price per KG e.g. 4000">
<input id="pImg" class="inp" placeholder="Image URL https://...">
<label style="font-size:11px"><input type="checkbox" id="pOut"> Out of Stock?</label>
<button class="btn btn-shop" onclick="addProduct()">➕ ADD PRODUCT</button>
</div><div id="adminProdList" style="margin-top:10px"></div></div>

<div id="paneOrders" style="display:none"><div id="ordersList"></div><button class="btn btn-shop" onclick="downloadReceipt()">📥 DOWNLOAD RECEIPT</button></div>

<div id="paneGal" style="display:none"><input id="galUrl" class="inp" placeholder="Gallery Image URL"><button class="btn btn-shop" onclick="addGallery()">➕ ADD TO GALLERY</button><div id="adminGalList" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"></div></div>

<div id="paneSet" style="display:none">
<div style="background:#102a54;border:1px solid #00FF88;padding:8px;border-radius:8px;margin:4px 0">
<div style="color:#00FF88;font-size:11px">Bank / MoMo Settings</div>
<input id="adminBank" class="inp" placeholder="Bank Account e.g. 123456 CENTENARY">
<input id="adminMoMo" class="inp" placeholder="MoMo Number e.g. 0700...">
<input id="adminWa" class="inp" placeholder="WhatsApp Orders e.g. 0700892386">
<button class="btn btn-shop" onclick="saveSettings()">💾 SAVE BANK</button>
</div>
<div style="margin-top:10px"><button class="btn btn-reset" onclick="changeAdminPassword()">🔑 CHANGE ADMIN PASS</button><button class="btn btn-reset" onclick="if(confirm('Reset All?')){localStorage.clear();location.reload()}">🗑️ RESET ALL DATA</button></div>
</div>

<div id="paneAI" style="display:none">
<h4 style="color:#FCDC04">🤖 AI Description Generator</h4>
<div style="background:#102a54;border:1px solid #FCDC04;padding:8px;border-radius:8px;margin:6px 0">
<input id="aiProdName" class="inp" placeholder="Product name for AI">
<button class="btn btn-shop" style="width:100%" onclick="generateAIDesc()">🤖 GENERATE DESCRIPTION</button>
<div id="aiResult" style="font-size:11px;color:#fff;margin-top:6px;background:#000;padding:6px;border-radius:6px;min-height:30px"></div>
</div></div>

<button class="btn btn-reset" style="width:100%;margin-top:10px" onclick="closeModal('adminModal')">CLOSE ADMIN</button>
</div></div><script>
let adminPass=localStorage.getItem('adminPass')||'wilson321';
let products=JSON.parse(localStorage.getItem('kfs_products')||'null')||[
{id:1,name:'Super Rice',price:4000,img:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300',out:false},
{id:2,name:'Nambale Beans',price:3500,img:'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300',out:false},
{id:3,name:'Posho Flour',price:2500,img:'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=300',out:false},
{id:4,name:'Matooke',price:2000,img:'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300',out:false}
];
let gallery=JSON.parse(localStorage.getItem('kfs_gallery')||'[]');
let cart=JSON.parse(localStorage.getItem('kfs_cart')||'{}');
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;});

function toast(m){let t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#102a54;color:#FCDC04;padding:12px 20px;border-radius:25px;border:2px solid #FCDC04;z-index:999999;font-weight:900;font-size:13px';document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}

function save(){localStorage.setItem('kfs_products',JSON.stringify(products));localStorage.setItem('kfs_gallery',JSON.stringify(gallery));localStorage.setItem('kfs_cart',JSON.stringify(cart));renderShop();renderAdmin();renderGalleryCust();updateCartBar();}

function renderShop(){
let s=document.getElementById('shop');s.innerHTML='';
products.forEach(p=>{
let inCart=cart[p.id]?.qty||1;
s.innerHTML+=`<div class="card"><img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1606787366850-de6330128bfc?w=300'"><div class="card-body">
<div style="font-weight:900;font-size:13px">${p.name}</div><div class="price">UGX ${p.price.toLocaleString()} / KG ${p.out?'<span style="color:red">- Out of Stock</span>':''}</div>
<div style="font-size:10px">TYPE KG:</div>
<input data-pid="${p.id}" id="qty_${p.id}" type="number" value="${inCart}" min="0.5" step="0.5" class="inp" ${p.out?'disabled':''}>
<button class="add ${p.out?'out':''}" onclick="addToCart(${p.id})" ${p.out?'disabled':''}>${p.out?'Out of Stock':(cart[p.id]?'Added ✅ - Update':'Add to Cart')}</button>
<div style="text-align:center;font-size:10px;color:#999;cursor:pointer" onclick="if(confirm('Delete?')){products=products.filter(x=>x.id!=${p.id});save()}">Delete</div>
</div></div>`;
});
}

function addToCart(id){
let qty=parseFloat(document.getElementById('qty_'+id).value)||0;
if(qty<=0){toast('❌ Type KG first!');return;}
let pr=products.find(p=>p.id==id);
if(pr.out){toast('❌ Out of Stock!');return;}
cart[id]={...pr,qty:qty};
save();toast(`✅ ${pr.name} - ${qty}KG added! Keep shopping!`);
}

function updateCartBar(){
let types=Object.keys(cart).length;let totalKg=0,total=0;
Object.values(cart).forEach(c=>{totalKg+=c.qty;total+=c.qty*c.price});
document.getElementById('cartCount').textContent=types;
document.getElementById('cartInfo').textContent=`${types} types • ${totalKg}kg • UGX ${total.toLocaleString()}`;
}

function resetCart(){if(confirm('Reset cart?')){cart={};save();toast('🗑️ Cart reset!');}}
function openCart(){openCheckout();}
function openCheckout(){
let list=document.getElementById('checkoutList');list.innerHTML='';
let total=0,totalKg=0;
Object.values(cart).forEach(c=>{let sub=c.price*c.qty;list.innerHTML+=`${c.name} - ${c.qty}KG = UGX ${sub.toLocaleString()}<br>`;total+=sub;totalKg+=c.qty;});
if(total>0)list.innerHTML+=`<br><b>Total: ${totalKg}kg - UGX ${total.toLocaleString()}</b>`;
document.getElementById('checkoutModal').style.display='block';
}
function closeModal(id){document.getElementById(id).style.display='none';}

function sendWA(){
if(Object.keys(cart).length===0){
 document.querySelectorAll('[data-pid]').forEach(inp=>{
  let pid=parseInt(inp.getAttribute('data-pid'));let qty=parseFloat(inp.value)||0;
  if(qty>0){let pr=products.find(p=>p.id==pid);if(pr&&!pr.out)cart[pid]={...pr,qty:qty};}
 });
}
if(Object.keys(cart).length===0){toast('❌ Type KG first!');return;}
let msg=`*KFS ORDER - The Pearl of Africa*%0A%0A`;let total=0,totalKg=0;
Object.values(cart).forEach((c,i)=>{let sub=c.price*c.qty;msg+=`${i+1}. ${c.name} - ${c.qty}KG x ${c.price} = UGX ${sub.toLocaleString()}%0A`;total+=sub;totalKg+=c.qty;});
let cust=document.getElementById('custName').value||'Customer';let phone=document.getElementById('custPhone').value||'';let loc=document.getElementById('custLoc').value||'';let pay=document.getElementById('payMode').value||'COD';
msg+=`%0A*Total KG:* ${totalKg}kg%0A*Total:* UGX ${total.toLocaleString()}%0A*Name:* ${cust}%0A*Phone:* ${phone}%0A*Location:* ${loc}%0A*Payment:* ${pay}%0A%0A_GPS + BANK included_`;
let waNum=localStorage.getItem('waNumber')||document.getElementById('adminWa')?.value||'0700892386';
window.open(`https://wa.me/256${waNum.slice(-9)}?text=${msg}`,'_blank');
save();toast('✅ Order sent to WhatsApp!');
}function requestAdmin(){let i=prompt('Enter Admin Password:');if(i===adminPass){document.getElementById('adminModal').style.display='block';renderAdmin();}else if(i!==null){toast('❌ Wrong password!');}}
function changeAdminPassword(){let o=prompt('Old password:');if(o!==adminPass){toast('❌ Wrong!');return;}let n=prompt('New password:');if(n){adminPass=n;localStorage.setItem('adminPass',n);toast('✅ Password changed!');}}
function showPane(p){['prod','orders','gal','set','ai'].forEach(x=>{document.getElementById('pane'+x.charAt(0).toUpperCase()+x.slice(1)).style.display=x===p?'block':'none';});document.querySelectorAll('.tab').forEach((t,i)=>{let keys=['prod','orders','gal','set','ai'];t.classList.toggle('active',keys[i]===p);});}
function renderAdmin(){
document.getElementById('adminProdList').innerHTML=products.map(p=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px;border-bottom:1px solid #333">${p.name} - ${p.price} <span><button onclick="toggleOut(${p.id})" style="font-size:10px">${p.out?'In Stock':'Out?'}</button> <button onclick="products=products.filter(x=>x.id!=${p.id});save()" style="color:red">X</button></span></div>`).join('');
document.getElementById('adminGalList').innerHTML=gallery.map((g,i)=>`<div style="position:relative"><img src="${g}" style="width:100%;height:80px;object-fit:cover;border-radius:6px"><button onclick="gallery.splice(${i},1);save()" style="position:absolute;top:2px;right:2px;background:red;color:#fff;border:0;border-radius:50%;width:20px;height:20px">X</button></div>`).join('');
document.getElementById('adminBank').value=localStorage.getItem('bankInfo')||'';document.getElementById('adminMoMo').value=localStorage.getItem('momoInfo')||'';document.getElementById('adminWa').value=localStorage.getItem('waNumber')||'0700892386';
}
function addProduct(){let n=document.getElementById('pName').value,p=parseFloat(document.getElementById('pPrice').value),img=document.getElementById('pImg').value||'https://images.unsplash.com/photo-1606787366850-de6330128bfc?w=300',out=document.getElementById('pOut').checked;if(!n||!p){toast('❌ Name & Price needed!');return;}products.push({id:Date.now(),name:n,price:p,img:img,out:out});document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImg').value='';save();toast('✅ Product added!');}
function toggleOut(id){let pr=products.find(p=>p.id==id);if(pr){pr.out=!pr.out;save();toast(pr.out?'🔴 Out of Stock':'🟢 In Stock');}}
function addGallery(){let url=document.getElementById('galUrl').value;if(!url){toast('❌ URL needed!');return;}gallery.push(url);document.getElementById('galUrl').value='';save();toast('✅ Gallery added!');}
function renderGalleryCust(){document.getElementById('galleryCust').innerHTML=gallery.map(g=>`<img src="${g}" style="width:100%;height:90px;object-fit:cover;border-radius:8px">`).join('')||'No images yet';}
function openGalleryCust(){renderGalleryCust();document.getElementById('galleryModal').style.display='block';}
function saveSettings(){localStorage.setItem('bankInfo',document.getElementById('adminBank').value);localStorage.setItem('momoInfo',document.getElementById('adminMoMo').value);localStorage.setItem('waNumber',document.getElementById('adminWa').value);toast('✅ Bank saved!');}
function downloadReceipt(){let txt='KFS RECEIPT\n';let total=0;Object.values(cart).forEach(c=>{txt+=`${c.name} - ${c.qty}KG x ${c.price} = ${c.qty*c.price}\n`;total+=c.qty*c.price;});txt+=`TOTAL UGX ${total}`;let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KFS_Receipt.txt';a.click();toast('📥 Receipt downloaded!');}
function generateAIDesc(){let name=document.getElementById('aiProdName').value||'Product';document.getElementById('aiResult').innerHTML=`<b>${name}</b> - Fresh from Pearl of Africa! High quality, organic, directly from Ugandan farms. Rich taste, nutritious, perfect for family. Grown with love in Mpigi. Order now via KFS! 🌱🇺🇬`;toast('🤖 AI description generated!');}
function downloadApp(){
if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')toast('✅ KFS App Installed! Check home screen!');deferredPrompt=null;});}
else{let m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';m.innerHTML=`<div style="background:#102a54;color:#FCDC04;padding:20px;border-radius:15px;max-width:350px;border:2px solid #FCDC04"><h3>📲 How to Download KFS App</h3><p style="color:#fff;font-size:13px;line-height:1.5"><b>Android:</b><br>1. Tap 3 dots ⋮ top right<br>2. Tap \"Add to Home Screen\" or \"Install App\"<br>3. Tap ADD → KFS on phone!<br><br><b>iPhone:</b><br>1. Tap Share ⬆️ bottom<br>2. Tap Add to Home Screen<br><br>Link: kfs-kampalafoodshop.vercel.app</p><button onclick="this.parentElement.parentElement.remove()" style="width:100%;margin-top:10px;padding:12px;background:#FCDC04;color:#000;border:0;border-radius:8px;font-weight:900">OK GOT IT!</button></div>`;document.body.appendChild(m);}
}
renderShop();updateCartBar();renderGalleryCust();
</script></body></html>
